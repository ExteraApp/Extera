name: iOS Build

on:
  workflow_dispatch:
jobs:
  build_ipa_scarlet:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: echo "FLUTTER_VERSION=stable" >> $GITHUB_ENV
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get

      - name: Set iOS Deployment Target to 14.0
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' ios/Runner.xcodeproj/project.pbxproj
          
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '14.0'/g" ios/Podfile
          fi

      - name: Build Unsigned IPA
        run: |
          flutter pub get
          cd ios && pod update && cd ..
          flutter build ios --release --no-codesign
          
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r extera.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-scarlet-bundle
          path: extera.ipa
          files: extera.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
